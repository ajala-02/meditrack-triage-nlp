[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meditrack-triage-nlp"
version = "0.1.0"
description = "Educational NLP prototype for triaging synthetic symptom descriptions"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "fastapi>=0.110",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pandas>=2.1",
    "scikit-learn>=1.4",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
transformer = [
    "accelerate>=0.27",
    "datasets>=2.17",
    "torch>=2.1",
    "transformers>=4.38",
]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
meditrack-triage = "meditrack_triage.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

